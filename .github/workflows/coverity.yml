# Coverity Scan (scan.coverity.com) — Synopsys/Black Duck's free cloud static
# analysis for open-source projects. Unlike the local analyzers in
# tools/static_analysis.sh this leg runs ONLY here: the full build is wrapped
# with cov-build, the capture (cov-int/) is uploaded to Coverity's servers and
# the findings are triaged on the scan.coverity.com dashboard.
#
# ── One-time manual setup (repository owner) ────────────────────────────────
#  1. Sign in at https://scan.coverity.com with the GitHub account and choose
#     "Add project" -> select MartinSch77/TrainDriversCabDisplay.
#  2. Project page -> "Project Settings" -> copy the project token.
#  3. GitHub repo -> Settings -> Secrets and variables -> Actions -> add two
#     repository secrets:
#        COVERITY_SCAN_TOKEN   the project token from step 2
#        COVERITY_SCAN_EMAIL   e-mail for the analysis notifications
#  4. Optional, recommended: project -> "Analysis Settings" -> Component Maps
#     -> map these path patterns as "Third Party"/"Ignore" so only first-party
#     code counts towards the defect density:
#        .*/build/_deps/.*        (fetched LVGL sources + Slint package)
#        .*/build/ui-slint/.*     (C++ generated by the slint-compiler)
#        .*autogen.*              (Qt moc/rcc output)
#  5. Optional: README badge — project page shows the badge snippet; it needs
#     the numeric project id, e.g.
#        [![Coverity](https://scan.coverity.com/projects/<ID>/badge.svg)](https://scan.coverity.com/projects/<ID>)
#
# The job skips cleanly while the secrets are missing (forks stay green).
# Upload quota (free tier): for a project of this size up to 28 builds/week —
# on-push to main plus the weekly cron stays far below that.
name: Coverity Scan

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC — keeps a weekly baseline even without pushes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.10.2"
  # scan.coverity.com project name, URL-encoded ("/" -> %2F)
  COVERITY_PROJECT: MartinSch77%2FTrainDriversCabDisplay

jobs:
  coverity:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # secrets are not readable in job-level `if`s — gate every later step
      # on this output instead, so unconfigured forks skip with a notice.
      - name: Check Coverity secrets
        id: guard
        env:
          TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::COVERITY_SCAN_TOKEN not set — Coverity upload skipped (setup steps in .github/workflows/coverity.yml)"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.run == 'true'

      - name: Install Qt (with Quick 3D)
        if: steps.guard.outputs.run == 'true'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtquick3d qtshadertools
          cache: true

      - name: Install SDL2, Slint runtime libs, CMake and Ninja
        if: steps.guard.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsdl2-dev libinput10 libgbm1 libxkbcommon0
          python3 -m pip install --upgrade cmake ninja

      # The analysis tool is ~1 GB; cache it keyed on Coverity's published md5
      # so a new tool release invalidates the cache automatically.
      - name: Coverity tool version key
        if: steps.guard.outputs.run == 'true'
        id: covkey
        run: |
          MD5=$(curl --silent --fail \
            --data "token=${{ secrets.COVERITY_SCAN_TOKEN }}&project=${COVERITY_PROJECT}&md5=1" \
            https://scan.coverity.com/download/linux64)
          echo "md5=$MD5" >> "$GITHUB_OUTPUT"

      - name: Cache Coverity build tool
        if: steps.guard.outputs.run == 'true'
        id: covcache
        uses: actions/cache@v4
        with:
          path: cov-analysis
          key: coverity-linux64-${{ steps.covkey.outputs.md5 }}

      - name: Download Coverity build tool
        if: steps.guard.outputs.run == 'true' && steps.covcache.outputs.cache-hit != 'true'
        run: |
          curl --silent --fail \
            --data "token=${{ secrets.COVERITY_SCAN_TOKEN }}&project=${COVERITY_PROJECT}" \
            -o coverity_tool.tgz https://scan.coverity.com/download/linux64
          mkdir cov-analysis
          tar xzf coverity_tool.tgz --strip-components=1 -C cov-analysis
          rm coverity_tool.tgz

      - name: Configure (all three frontends)
        if: steps.guard.outputs.run == 'true'
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DRAILDECK_UI=all
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"

      - name: Build under cov-build
        if: steps.guard.outputs.run == 'true'
        run: |
          export PATH="$PWD/cov-analysis/bin:$PATH"
          cov-build --dir cov-int cmake --build build -j"$(nproc)"

      # A capture below ~85% means cov-build missed compiler invocations and
      # the analysis would silently cover only part of the code — fail loudly.
      - name: Verify capture completeness
        if: steps.guard.outputs.run == 'true'
        run: |
          tail -5 cov-int/build-log.txt
          RATIO=$(grep -oE '[0-9]+% are ready for analysis|\([0-9]+%\) are ready for analysis' cov-int/build-log.txt \
                  | grep -oE '[0-9]+' | head -1)
          echo "capture ratio: ${RATIO:-unknown}%"
          [ -n "$RATIO" ] && [ "$RATIO" -ge 85 ]

      - name: Upload capture to scan.coverity.com
        if: steps.guard.outputs.run == 'true'
        run: |
          tar czf raildeck-cov.tgz cov-int
          HTTP=$(curl --silent --output response.txt --write-out "%{http_code}" \
            --form token="${{ secrets.COVERITY_SCAN_TOKEN }}" \
            --form email="${{ secrets.COVERITY_SCAN_EMAIL }}" \
            --form file=@raildeck-cov.tgz \
            --form version="${GITHUB_SHA}" \
            --form description="CI ${GITHUB_REF_NAME} $(date -u +%Y-%m-%d)" \
            "https://scan.coverity.com/builds?project=${COVERITY_PROJECT}")
          cat response.txt; echo
          echo "HTTP $HTTP"
          # 200/201 with a quota message still means "not analyzed" — treat
          # anything but an accepted submission as a failure.
          [ "$HTTP" = "200" ] || [ "$HTTP" = "201" ]
          ! grep -qi "quota" response.txt
